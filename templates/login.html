{% extends 'base.html' %}

{% block title %}Login / Mobile Access | Mukesh Ajmera LIC Services{% endblock %}

{% block content %}
<div class="py-20 hero-gradient-bg min-h-[75vh] flex items-center justify-center">
  <div class="max-w-md w-full mx-auto px-4">
    
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-6">
      
      <!-- Header -->
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-bold mx-auto shadow-lg shadow-blue-500/20">
          <i class="fas fa-mobile-alt"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">Mobile Access Portal</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Enter your 10-digit mobile number and password to log in.
        </p>
      </div>

      <!-- Login Form -->
      <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
            Mobile Number (10 digits)
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 font-bold text-xs">+91</span>
            <input type="tel" name="phone" placeholder="9829943216" required pattern="[0-9]{10}" class="w-full pl-12 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm font-semibold focus:ring-2 focus:ring-blue-600 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
            Password <span class="text-red-500">*</span>
          </label>
          <input type="password" name="password" placeholder="Enter your password" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-lg shadow-blue-500/25 transition">
          Continue with Mobile
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 dark:border-slate-800 text-center">
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Need help? <a href="https://wa.me/919829943216" target="_blank" class="text-emerald-600 font-bold hover:underline">Contact Mukesh Ajmera on WhatsApp</a>
        </p>
      </div>

    </div>

  </div>
</div>
{% endblock %}
