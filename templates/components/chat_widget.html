<!-- Floating Smart Assistant Window -->
<div id="chat-widget-window" class="hidden fixed bottom-24 right-4 sm:right-6 z-50 w-[92vw] sm:w-[400px] h-[540px] bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden transition-all duration-300">
  
  <!-- Chat Header with Min, Max, End Chat, and Close Controls -->
  <div class="bg-gradient-to-r from-blue-900 via-blue-700 to-red-600 p-3.5 text-white flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-lg font-bold">
        <i class="fas fa-robot text-yellow-300"></i>
      </div>
      <div>
        <h3 class="font-black text-sm leading-tight">LIC MITRA (Smart Advisor)</h3>
        <p class="text-[11px] text-blue-100 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping inline-block"></span> Online • Sarwar Advisory
        </p>
      </div>
    </div>

    <!-- Header Action Controls: End Chat, Minimize, Maximize, Close -->
    <div class="flex items-center gap-1">
      <button id="chat-end-btn" class="p-1.5 text-white/80 hover:text-red-300 hover:bg-white/10 rounded-lg transition" title="End Chat & Clear Session">
        <i class="fas fa-trash-alt text-xs"></i>
      </button>
      <button id="chat-min-btn" class="p-1.5 text-white/80 hover:text-white hover:bg-white/10 rounded-lg transition" title="Minimize Window">
        <i class="fas fa-minus text-xs"></i>
      </button>
      <button id="chat-max-btn" class="p-1.5 text-white/80 hover:text-white hover:bg-white/10 rounded-lg transition" title="Maximize / Restore Window">
        <i class="far fa-window-maximize text-xs"></i>
      </button>
      <button id="chat-close-btn" class="p-1.5 text-white/80 hover:text-red-400 hover:bg-white/10 rounded-lg transition" title="Close Window">
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Quick Chip System Options Inputs -->
  <div class="px-3 py-2 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 flex items-center gap-2 overflow-x-auto text-[11px] whitespace-nowrap scrollbar-none">
    <button class="quick-chip px-3 py-1 bg-white dark:bg-slate-700 text-blue-700 dark:text-blue-300 rounded-full border border-blue-200 dark:border-slate-600 hover:bg-blue-50 font-bold transition flex items-center gap-1">
      <i class="fas fa-user-circle"></i> My Profile Details

      👧 Sukanya Samriddhi (SSY)
    </button>
    <button class="quick-chip px-3 py-1 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-full border border-slate-200 dark:border-slate-600 hover:border-blue-500 font-medium transition">
      🛡️ Tax Savings Sec 80C
    </button>
    <button class="quick-chip px-3 py-1 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-full border border-slate-200 dark:border-slate-600 hover:border-blue-500 font-medium transition">
      📋 Tell me all 20 plans

  </div>

    <!-- Initial Greeting -->
    <div class="flex justify-start mb-3">
      <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xs font-bold mr-2 flex-shrink-0">
        <i class="fas fa-robot"></i>
      </div>
      <div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 p-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm shadow border border-slate-100 dark:border-slate-700 space-y-2">
        <p class="font-semibold text-blue-700 dark:text-blue-400">नमस्कार! Khamma Ghani! 🙏</p>
        <p>मैं <strong>LIC MITRA</strong> — मुकेश अजमेरा सरवाड़ का स्मार्ट वित्तीय सलाहकार हूँ।</p>

            <span><i class="fas fa-user-circle mr-1.5"></i> 1. My Profile Details (प्रोफ़ाइल विवरण)</span>
            <i class="fas fa-chevron-right text-[10px]"></i>
          </button>
          <button onclick="sendOptionQuery('₹2,000/mo Investment')" class="w-full text-left px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-800 dark:text-slate-200 rounded-xl font-semibold transition flex items-center justify-between">

          <button onclick="sendOptionQuery('Sukanya Samriddhi Yojana')" class="w-full text-left px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-800 dark:text-slate-200 rounded-xl font-semibold transition flex items-center justify-between">
            <span><i class="fas fa-child mr-1.5 text-purple-600"></i> 3. Sukanya Samriddhi (SSY 8.2%)</span>

    <input type="text" id="chat-input" placeholder="Ask about Jeevan Labh, PPF, SSY..." class="flex-1 bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white px-4 py-2.5 rounded-xl text-sm border-none focus:ring-2 focus:ring-blue-600 outline-none">
    <button id="chat-send-btn" class="w-10 h-10 bg-blue-600 hover:bg-blue-700 text-white rounded-xl flex items-center justify-center shadow transition">
      <i class="fas fa-paper-plane text-sm"></i>
    </button>
  </div>

</div>
